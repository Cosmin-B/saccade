name: Bug report
description: Report reproducible incorrect behavior in Saccade.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach private screen contents, recognized text, credentials, model weights,
        signing material, or unredacted diagnostics.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a full commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - Windows x64
        - Windows arm64
        - Portable C11/C++20 SDK
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating-system version, processor, and graphics adapter.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest deterministic sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include only bounded logs or measurements that contain no private content.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private screen contents, recognized text, credentials, keys, and model artifacts.
          required: true
