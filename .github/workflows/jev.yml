name: Jev integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-loop:
    name: Native Jev loop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Configure native test build
        run: cmake -G Ninja -S . -B build/jev-ci -DSACCADE_BUILD_APPLICATION=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build portable native form fixture
        run: cmake --build build/jev-ci --config Debug --parallel 2 --target saccade_jev_native_fixture
      - name: Build production desktop MCP
        if: runner.os != 'Linux'
        run: cmake --build build/jev-ci --config Debug --parallel 2 --target saccade_mcp
      - name: Run credential-free integration tests
        run: ctest --test-dir build/jev-ci -C Debug -R "^(integrations.jev|tools.mcp_stdio)$" --output-on-failure
      - name: Verify installable client
        run: |
          python -m pip install ./integrations/jev
          saccade-jev --help
