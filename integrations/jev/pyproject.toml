[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saccade-jev"
version = "0.1.0"
description = "Optional bounded TypeSafe Jev decision client for Saccade"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
saccade-jev = "saccade_jev.__main__:main"

[tool.setuptools.packages.find]
include = ["saccade_jev*"]
